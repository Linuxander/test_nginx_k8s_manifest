apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: nginx
    meta.helm.sh/release-namespace: default
spec:
  type: {{ .Values.service.type }}
  selector:
    app: nginx
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
